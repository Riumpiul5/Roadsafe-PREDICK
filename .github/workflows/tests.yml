name: RoadSafe AI CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: . # <-- Tambahan penting agar Python mengenali folder root

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install ruff

    - name: Create .env file for testing
      run: cp .env.example .env

    - name: Lint with Ruff
      run: |
        ruff check . || true

    - name: Generate Dummy Model Artifact
      run: |
        python scripts/generate_test_artifact.py

    - name: Run Pytest with Coverage
      run: |
        pytest --cov=app --cov=ml --cov-report=term-missing

    - name: Build Docker Image
      run: |
        docker build -t roadsafe-ai:test .